name: stroke_reproducibility_rebuilt
version: 3.0.0
manuscript: NEURI-D-26-00184
journal: Neuroscience Informatics
data:
  workbook_env_var: STROKE_DATA_PATH
  local_secure_path: data/raw/database_stroke_copy.xlsx (git-ignored; never committed)
  synthetic_fixture: data/synthetic_fixtures/synthetic_registry.xlsx
  synthetic_env_var: STROKE_SYNTHETIC=1
  dictionary: dictionary/stroke_data_dictionary.xlsx
