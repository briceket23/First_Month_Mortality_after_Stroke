  reconstructed: full analysis; gated by outcome_definition.approval_state
  sensitivity: labelled scenarios
  all: audit -> reconstructed -> manuscript tables -> verification
seed: 20261016
outputs:
  figures: outputs/figures
  tables: outputs/tables
  reports: outputs/reports
  logs: outputs/logs
  manifests: outputs/manifests
