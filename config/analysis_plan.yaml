questions:
- 'Q1 ascertainment: how was first-month death recorded over 2010-2023 and what can be said about registry-wide mortality?'
- 'Q2 prediction: how well do admission data discriminate first-month death among labelled patients, and which conclusions survive selective recording?'
estimands:
  ascertainment: registry-wide 30-day mortality (bounds; IPW; delta-adjusted)
  prediction: risk of death within 30 d of admission given admission data
comparison: paired DeLong difference with 95% CI (pooled OOF and temporal test)
