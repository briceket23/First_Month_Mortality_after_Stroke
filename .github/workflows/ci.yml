name: reproducibility-ci
on: [push, pull_request, workflow_dispatch]
jobs:
  synthetic-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.lock
      - run: python scripts/make_synthetic_fixture.py
      - run: STROKE_SYNTHETIC=1 python -m pytest -q tests
      - run: STROKE_SYNTHETIC=1 python run_all.py --mode all --accept-provisional --quick --clean --skip-tests
      - uses: actions/upload-artifact@v4
        with: {name: synthetic-outputs, path: outputs}
